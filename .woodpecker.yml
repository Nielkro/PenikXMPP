steps:
  build:
    when:
      - branch: master
        event: push
      - event: tag
    image: codeberg.org/freeyourgadget/android-fdroid-tools:latest
    commands:
      - cd android
      - ./gradlew clean
      - ./gradlew assembleConversationsFreeDebug
      - ./gradlew assembleQuicksyFreeDebug
