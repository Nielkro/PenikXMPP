name: Fast CI (Feature Branches & PRs)

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - dev
      - main
      - master

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-tests:
    name: Lua Modules Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Run Lua test suites
        run: |
          lua server/Modules/test_mod_funxmpp.lua
          lua server/Modules/test_mod_stickers_auth.lua
          lua server/Modules/test_mod_penik_silent_muc.lua

  rust-check:
    name: Rust Microservices Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server/MicroServices/penik-service-rs -> target
            server/MicroServices/penik-bot-gateway -> target

      - name: Check penik-service-rs
        run: |
          cd server/MicroServices/penik-service-rs
          cargo check

      - name: Check penik-bot-gateway
        run: |
          cd server/MicroServices/penik-bot-gateway
          cargo check

  android-compile:
    name: Android Kotlin & Java Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android Debug Kotlin and Java
        run: |
          cd android
          bash ./gradlew compileConversationsFreeDebugKotlin compileConversationsFreeDebugJavaWithJavac
