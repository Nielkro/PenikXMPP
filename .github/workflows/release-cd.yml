name: Production Release & Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-gate:
    name: Full Test Gate Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Run Lua tests
        run: |
          lua server/Modules/test_mod_funxmpp.lua
          lua server/Modules/test_mod_stickers_auth.lua
          lua server/Modules/test_mod_penik_silent_muc.lua

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust Services
        run: |
          cd server/MicroServices/penik-service-rs && cargo test --all
          cd ../penik-bot-gateway && cargo test --all

  build-apk:
    name: Build & Package Android APK
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          bash ./gradlew assembleConversationsFreeDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: penik-release-apk
          path: android/build/outputs/apk/conversationsFree/debug/*.apk
          retention-days: 30

  deploy-server:
    name: Deploy Prosody & Stickers Services
    needs: test-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Deploy to Servers via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SNIKKET_HOST: ${{ secrets.SNIKKET_HOST }}
          STICKERS_HOST: ${{ secrets.STICKERS_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT_B64 }}
          STICKERS_SHARED_SECRET: ${{ secrets.STICKERS_SHARED_SECRET }}
        if: env.SSH_KEY != '' && env.DEPLOY_SCRIPT != ''
        run: |
          mkdir -p ~/.ssh scripts
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SNIKKET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "$STICKERS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Unpack private deployment script from secret
          echo "$DEPLOY_SCRIPT" | base64 -d > scripts/deploy_server.sh
          chmod +x scripts/deploy_server.sh

          export SNIKKET_HOST="$SNIKKET_HOST"
          export STICKERS_HOST="$STICKERS_HOST"
          export SERVER_USER="$SERVER_USER"
          export STICKERS_SHARED_SECRET="$STICKERS_SHARED_SECRET"

          bash scripts/deploy_server.sh snikket
          bash scripts/deploy_server.sh stickers
