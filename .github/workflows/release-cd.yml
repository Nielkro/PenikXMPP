name: Production Release & Deploy

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plan/**'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-gate:
    name: Full Test Gate Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run Lua tests
        run: |
          lua server/Modules/test_mod_funxmpp.lua
          lua server/Modules/test_mod_stickers_auth.lua
          lua server/Modules/test_mod_penik_silent_muc.lua

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust Services
        run: |
          cd server/MicroServices/penik-service-rs && cargo test --all
          cd ../penik-bot-gateway && cargo test --all

  build-apk:
    name: Build & Package Android APK
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          bash ./gradlew assembleConversationsFreeDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: penik-release-apk
          path: android/build/outputs/apk/conversationsFree/debug/*.apk
          retention-days: 30

  deploy-server:
    name: Deploy Prosody Modules to Snikket
    needs: test-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SNIKKET_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
        if: env.SSH_KEY != '' && env.SERVER_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "[*] Creating remote modules directory..."
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p /etc/snikket/modules"

          echo "[*] Uploading Lua modules..."
          scp server/Modules/mod_funxmpp.lua server/Modules/mod_stickers_auth.lua server/Modules/mod_penik_silent_muc.lua "$SERVER_USER@$SERVER_HOST:/etc/snikket/modules/"

          echo "[*] Reloading Prosody container..."
          ssh "$SERVER_USER@$SERVER_HOST" "cd /etc/snikket && (docker compose restart snikket || docker restart snikket || true)"
          echo "[+] Deployment to Snikket completed successfully!"
