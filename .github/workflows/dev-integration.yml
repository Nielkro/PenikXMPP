name: Dev Integration Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: dev-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua-integration:
    name: Lua Modules Full Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Run Lua test suites
        run: |
          lua server/Modules/test_mod_funxmpp.lua
          lua server/Modules/test_mod_stickers_auth.lua
          lua server/Modules/test_mod_penik_silent_muc.lua

  rust-integration:
    name: Rust Services Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server/MicroServices/penik-service-rs -> target
            server/MicroServices/penik-bot-gateway -> target

      - name: Test penik-service-rs
        run: |
          cd server/MicroServices/penik-service-rs
          cargo test --all

      - name: Test penik-bot-gateway
        run: |
          cd server/MicroServices/penik-bot-gateway
          cargo test --all

      - name: Clippy penik-service-rs
        run: |
          cd server/MicroServices/penik-service-rs
          cargo clippy -- -D warnings || true

      - name: Clippy penik-bot-gateway
        run: |
          cd server/MicroServices/penik-bot-gateway
          cargo clippy -- -D warnings || true

  android-integration:
    name: Android Full Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        run: |
          cd android
          bash ./gradlew testConversationsFreeDebugUnitTest

      - name: Build Android Debug APK
        run: |
          cd android
          bash ./gradlew assembleConversationsFreeDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: penik-dev-debug-apk
          path: android/build/outputs/apk/conversationsFree/debug/*.apk
          retention-days: 7
