[package]
name = "penik-bot-gateway"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dashmap = "6.1"
quick-xml = "0.37"
roxmltree = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
uuid = { version = "1.10", features = ["v4"] }
