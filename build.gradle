import com.android.build.api.variant.FilterConfiguration

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.10.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.20'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.diffplug.spotless'

repositories {
    google()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

spotless {
    ratchetFrom '2.17.4'
    java {
        target '**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
    }
}

def abiCodes = ['armeabi-v7a': 1, 'x86': 2, 'x86_64': 3, 'arm64-v8a': 4]

configurations.named('implementation') {
    exclude group: 'org.jetbrains', module: 'annotations'
}

configurations {
    freeImplementation {}
    conversationsPlaystoreImplementation {}
    quicksyImplementation {}
    quicksyPlaystoreImplementation {}
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    annotationProcessor 'org.immutables:value:2.12.2'
    implementation 'org.immutables:value-annotations:2.12.2'
    annotationProcessor project(':libs:annotation-processor')
    implementation project(':libs:annotation')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.emoji2:emoji2:1.6.0'
    freeImplementation 'androidx.emoji2:emoji2-bundled:1.6.0'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.heifwriter:heifwriter:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.github.open-keychain.open-keychain:openpgp-api:v5.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'com.google.guava:guava:33.7.1-android'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.vanniktech:android-image-cropper:4.7.0'
    implementation 'im.conversations.webrtc:webrtc-android:149.0.0'
    implementation 'io.deepmedia.community:transcoder-android:0.11.2'
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    //noinspection NewerVersionAvailable
    implementation 'net.fellbaum:jemoji:1.7.6' //1.7.6 is the latest with Java 8 support
    implementation 'org.bouncycastle:bcmail-jdk18on:1.86'
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
    implementation 'org.hsluv:hsluv:1.0.2'
    implementation 'org.jxmpp:jxmpp-jid:1.1.0'
    implementation 'org.jxmpp:jxmpp-stringprep-libidn:1.1.0'
    implementation 'org.minidns:minidns-client:1.1.1'
    implementation 'org.minidns:minidns-dnssec:1.1.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    //noinspection NewerVersionAvailable
    implementation 'org.whispersystems:signal-protocol-java:2.6.2'
    conversationsPlaystoreImplementation 'com.android.installreferrer:installreferrer:2.2'
    quicksyImplementation 'io.michaelrocks:libphonenumber-android:9.0.40'
    quicksyPlaystoreImplementation 'com.google.android.gms:play-services-auth-api-phone:18.3.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

def signingPropertiesFile = rootProject.file('signing.properties')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

android {
    namespace = 'eu.siacs.conversations'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
        versionCode = 42181
        versionName = '2.20.4'
        applicationId = 'ru.penik.xmpp'
        resValue('string', 'applicationId', applicationId)
        def appName = "Penik"
        resValue('string', 'app_name', appName)
        buildConfigField('String', 'APP_NAME', "\"${appName}\"")
    }

    splits {
        abi {
            universalApk = true
            enable = true
            reset()
            //noinspection ChromeOsAbiSupport
            include(abiCodes.keySet() as String[])
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    flavorDimensions += 'mode'
    flavorDimensions += 'distribution'

    productFlavors {
        quicksy {
            dimension = 'mode'
            applicationId = 'im.quicksy.client'
            resValue('string', 'applicationId', applicationId)
            def appName = "Quicksy"
            resValue('string', 'app_name', appName)
            buildConfigField('String', 'APP_NAME', "\"${appName}\"")
            buildConfigField('String', 'PRIVACY_POLICY', '"https://quicksy.im/privacy.htm"')

            def propsFile = rootProject.file('quicksy-auth-secret.properties')
            def key = null
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                key = props.getProperty('QUICKSY_AUTHENTICATION_SECRET')
            }
            buildConfigField('String', 'QUICKSY_AUTHENTICATION_SECRET', key != null ? "\"${key}\"" : 'null')
        }

        conversations {
            dimension = 'mode'
            buildConfigField('String', 'PRIVACY_POLICY', '"https://conversations.im/privacy.html"')
        }

        playstore {
            dimension = 'distribution'
            versionNameSuffix = '+playstore'
        }
        free {
            dimension = 'distribution'
            versionNameSuffix = '+free'
        }
    }

    sourceSets {
        quicksyFree {
            java.srcDir('src/quicksyFree/java')
        }
        quicksyPlaystore {
            java.srcDir('src/quicksyPlaystore/java')
            res.srcDir('src/quicksyPlaystore/res')
        }
        conversationsFree {
            java.srcDir('src/conversationsFree/java')
        }
        conversationsPlaystore {
            java.srcDir('src/conversationsPlaystore/java')
            res.srcDir('src/conversationsPlaystore/res')
        }
    }

    if (signingPropertiesFile.exists()) {
        def props = new Properties()
        signingPropertiesFile.withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile = file(props['keystore'])
                storePassword = props['keystore.password']
                keyAlias = props['keystore.alias']
                keyPassword = props['keystore.password']
            }
        }
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            if (signingPropertiesFile.exists()) {
                signingConfig = signingConfigs.getByName('release')
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/LICENSE.md',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        disable += ['MissingTranslation', 'InvalidPackage', 'AppCompatResource']
    }

    buildFeatures {
        buildConfig = true
        resValues = true
        dataBinding = true
        compose = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def distribution = variant.productFlavors.find { it.first == 'distribution' }?.second


        variant.outputs.each { output ->
            def abi = output.filters.find {
                it.filterType == FilterConfiguration.FilterType.ABI
            }?.identifier
            def versionCode = android.defaultConfig.versionCode
            def versionName = android.defaultConfig.versionName + '+' + distribution
            def offset = abi != null ? abiCodes[abi] : null
            output.versionCode.set(offset != null
                    ? (100 * versionCode) + offset
                    : 100 * versionCode)

            def qualifier = abi ?: 'universal'
            output.outputFileName.set(variant.applicationId.map { appId ->
                "${appId}-${versionName}-${qualifier}.apk".toString()
            })
        }
    }
}

subprojects {
    plugins.withId('com.android.library') {
        android {
            lint {
                disable += ['AndroidGradlePluginVersion', 'MissingTranslation']
            }
        }
    }
    plugins.withId('com.android.application') {
        android {
            lint {
                disable += ['AndroidGradlePluginVersion', 'MissingTranslation']
            }
        }
    }
}